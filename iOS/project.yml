name: Swatchbook
options:
  bundleIdPrefix: com.shimondeitel.swatchbook
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Swatchbook:
    type: application
    platform: iOS
    sources:
      - path: Swatchbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.swatchbook
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Swatchbook/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  SwatchbookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SwatchbookTests
      - path: Swatchbook.storekit
    dependencies:
      - target: Swatchbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.swatchbook.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  SwatchbookUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SwatchbookUITests
    dependencies:
      - target: Swatchbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.swatchbook.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Swatchbook:
    build:
      targets:
        Swatchbook: all
        SwatchbookTests: [test]
        SwatchbookUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Swatchbook.storekit
    test:
      config: Debug
      storeKitConfiguration: Swatchbook.storekit
      targets:
        - SwatchbookTests
        - SwatchbookUITests
    archive:
      config: Release
